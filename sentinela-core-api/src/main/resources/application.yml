spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:sentinela_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  gateway:
    url: ${AI_GATEWAY_URL:http://localhost:8000}