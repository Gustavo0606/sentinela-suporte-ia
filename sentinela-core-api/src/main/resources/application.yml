spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:sentinela_db}
    username: ${DB_USER:usuario_local}
    password: ${DB_PASSWORD:senha_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true